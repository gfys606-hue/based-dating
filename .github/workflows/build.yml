# Builds Based on every push to main:
#   1. the website version  -> published with GitHub Pages
#   2. a test Android app   -> downloadable at https://based-social.com/test (and the run's "Artifacts")
#   3. the Google Play file -> "based-play-store-bundle" artifact (app-release.aab),
#      built only once the ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD secrets are set
# Free for public repos. Nothing to install on your computer.
name: Build Based

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  # Public, browser-safe values (protected by row-level security in the database)
  SUPABASE_URL: https://dzfnetcoyxjyjtmorfgk.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_6LwInbn32Vkcz5LbX5O6Bg_-id7TuFQ

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add web + Android project folders
        run: |
          flutter create . --platforms=web,android --org com.based --project-name based_dating
          rm -rf test

      - name: Android permissions (camera, microphone, location, internet)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="based_dating"#android:label="Based"#' android/app/src/main/AndroidManifest.xml

      - name: Google Play setup (app ID + release signing)
        run: python3 tool/android_release.py

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build website
        run: >
          flutter build web --release
          --base-href "/"
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Build Android test app (published at based-social.com/test)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Signed with the upload key once its secrets are set (so installs update in place);
          # until then with a temporary debug key.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          fi
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          mkdir -p build/web/test
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/web/test/based-test.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/web/test/based-test-older-phones.apk
          SIZE=$(du -m build/web/test/based-test.apk | cut -f1)
          printf '{"build": %s, "date": "%s", "size_mb": %s, "signed": "%s"}\n' \
            "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%MZ)" "$SIZE" "$([ -n "$KEYSTORE_B64" ] && echo upload || echo debug)" \
            > build/web/test/build.json

      - uses: actions/upload-artifact@v4
        with:
          name: based-android-test-app
          path: app/build/web/test/*.apk

      - name: Build Google Play bundle (.aab)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::Upload key secrets not set yet - skipping the Google Play bundle."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - uses: actions/upload-artifact@v4
        with:
          name: based-play-store-bundle
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy-website:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
