# One-off helper: downloads the free Pixabay photos used by the opening (Pixabay Content License,
# free for commercial use, no attribution required) and commits them to tools/intro_photo/src.
name: Fetch intro photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-photos.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p tools/intro_photo/src
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for f in 2020/04/30/19/01/dining-room-5114247 2014/06/21/17/47/bed-373981 2016/11/22/23/31/candles-1851176 \
                   2013/03/01/19/28/france-88379 2015/01/29/19/17/castle-616561 2016/12/25/22/32/gladiator-1931077 \
                   2022/08/09/13/11/ireland-7374959 2017/08/19/18/20/dungeon-2659379 2014/11/01/18/14/forge-512620; do
            n=$(basename $f)
            curl -fsSL -A "$UA" -e https://pixabay.com/ "https://cdn.pixabay.com/photo/${f}_1920.jpg" -o tools/intro_photo/src/$n.jpg \
              || curl -fsSL -A "$UA" -e https://pixabay.com/ "https://cdn.pixabay.com/photo/${f}_1280.jpg" -o tools/intro_photo/src/$n.jpg
          done
          ls -la tools/intro_photo/src
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/intro_photo/src
          git commit -m "Intro photos from Pixabay (free license) [skip ci]" || exit 0
          git push
