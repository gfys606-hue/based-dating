name: based_dating
description: Based Dating v1 — real people, real conversations.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  record: ^6.1.1
  audioplayers: ^6.5.0
  path_provider: ^2.1.4
  cross_file: ^0.3.4
  geolocator: ^13.0.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  livekit_client: ^2.4.0
  shared_preferences: ^2.3.2
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App icon (generated during the build: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E1A45"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
